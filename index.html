<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Викторина для Розалины</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #fff6dc, #f2e8ff);
      color: #242424;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .game {
      width: min(100%, 520px);
      background: rgba(255,255,255,0.92);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(75, 42, 120, 0.18);
      text-align: center;
    }

    h1 {
      margin: 2px 0 12px;
      color: #7b2cbf;
      font-size: clamp(25px, 7vw, 36px);
    }

    .photo {
      width: 100%;
      max-height: 330px;
      object-fit: cover;
      border-radius: 18px;
      border: 4px solid white;
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 2px 8px;
      font-weight: bold;
      color: #6a4190;
    }

    .question {
      font-size: clamp(20px, 5.5vw, 27px);
      font-weight: bold;
      line-height: 1.25;
      margin: 14px 0;
      min-height: 64px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .answer {
      background: white;
      border: 2px solid #decdf0;
      color: #292929;
    }

    .answer:active { transform: scale(0.99); }
    .answer.correct { background: #baf3bd; border-color: #50a855; }
    .answer.wrong { background: #ffbaba; border-color: #d95555; }
    .answer:disabled { color: #292929; opacity: 1; }

    .result {
      min-height: 50px;
      margin: 14px 0 8px;
      font-size: 19px;
      font-weight: bold;
      line-height: 1.3;
    }

    .next, .restart {
      background: #ffd166;
      color: #3b2b00;
      margin-top: 6px;
    }

    .restart { background: #baf3bd; }

    .hidden { display: none; }

    .footer {
      margin-top: 12px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Викторина для Розалины</h1>

    <img id="photo" class="photo" src="naelya_happy.jpg" alt="Реакция Наэли">

    <div class="topline">
      <span id="number">Вопрос 1 из 10</span>
      <span id="score">Счёт: 0</span>
    </div>

    <div id="question" class="question"></div>
    <div id="answers" class="answers"></div>

    <div id="result" class="result">Выберите один вариант ответа</div>

    <button id="next" class="next" disabled>Следующий вопрос ➜</button>
    <button id="restart" class="restart hidden">Сыграть ещё раз</button>

    <div class="footer">Сделано специально для Розалины ❤️</div>
  </main>

  <script>
    const questions = [
      {
        question: "Какой город является столицей Казахстана?",
        answers: ["Алматы", "Астана", "Караганда", "Шымкент"],
        correct: "Астана"
      },
      {
        question: "Сколько дней в одной неделе?",
        answers: ["Пять", "Шесть", "Семь", "Восемь"],
        correct: "Семь"
      },
      {
        question: "Какой океан является самым большим?",
        answers: ["Атлантический", "Индийский", "Северный Ледовитый", "Тихий"],
        correct: "Тихий"
      },
      {
        question: "Как называется самая высокая гора в мире?",
        answers: ["Эверест", "Эльбрус", "Килиманджаро", "Алтай"],
        correct: "Эверест"
      },
      {
        question: "Сколько месяцев в одном году?",
        answers: ["Десять", "Одиннадцать", "Двенадцать", "Тринадцать"],
        correct: "Двенадцать"
      },
      {
        question: "Какое животное называют царём зверей?",
        answers: ["Тигр", "Лев", "Медведь", "Волк"],
        correct: "Лев"
      },
      {
        question: "Какого цвета обычно листья летом?",
        answers: ["Красного", "Синего", "Зелёного", "Белого"],
        correct: "Зелёного"
      },
      {
        question: "Сколько будет 7 умножить на 8?",
        answers: ["48", "54", "56", "64"],
        correct: "56"
      },
      {
        question: "Какая планета находится ближе всего к Солнцу?",
        answers: ["Земля", "Марс", "Венера", "Меркурий"],
        correct: "Меркурий"
      },
      {
        question: "Как называется столица Франции?",
        answers: ["Рим", "Париж", "Берлин", "Мадрид"],
        correct: "Париж"
      }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    const photo = document.getElementById("photo");
    const number = document.getElementById("number");
    const scoreText = document.getElementById("score");
    const questionText = document.getElementById("question");
    const answersBox = document.getElementById("answers");
    const result = document.getElementById("result");
    const nextButton = document.getElementById("next");
    const restartButton = document.getElementById("restart");

    function showQuestion() {
      answered = false;
      const item = questions[current];

      photo.src = "naelya_happy.jpg";
      number.textContent = `Вопрос ${current + 1} из ${questions.length}`;
      scoreText.textContent = `Счёт: ${score}`;
      questionText.textContent = item.question;
      result.textContent = "Выберите один вариант ответа";
      result.style.color = "#333";
      nextButton.disabled = true;

      answersBox.innerHTML = "";

      item.answers.forEach(answer => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.addEventListener("click", () => checkAnswer(button, answer));
        answersBox.appendChild(button);
      });
    }

    function checkAnswer(selectedButton, selectedAnswer) {
      if (answered) return;
      answered = true;

      const correctAnswer = questions[current].correct;
      const buttons = [...answersBox.querySelectorAll(".answer")];

      if (selectedAnswer === correctAnswer) {
        score++;
        photo.src = "naelya_correct.jpg";
        result.textContent = "Правильно! Молодец! 🎉";
        result.style.color = "green";
        selectedButton.classList.add("correct");
      } else {
        photo.src = "naelya_sad.jpg";
        result.textContent = `Неправильно. Правильный ответ: ${correctAnswer}`;
        result.style.color = "red";
        selectedButton.classList.add("wrong");

        buttons.forEach(button => {
          if (button.textContent === correctAnswer) {
            button.classList.add("correct");
          }
        });
      }

      buttons.forEach(button => button.disabled = true);
      scoreText.textContent = `Счёт: ${score}`;
      nextButton.disabled = false;
    }

    function showFinal() {
      number.textContent = "Викторина завершена!";
      scoreText.textContent = "";
      questionText.textContent = `Розалина, твой результат: ${score} из ${questions.length}`;
      answersBox.innerHTML = "";
      nextButton.classList.add("hidden");
      restartButton.classList.remove("hidden");

      if (score === questions.length) {
        photo.src = "naelya_correct.jpg";
        result.textContent = "Великолепно! Ты настоящий чемпион! 🏆";
        result.style.color = "green";
      } else if (score >= 7) {
        photo.src = "naelya_happy.jpg";
        result.textContent = "Отличный результат! 🌟";
        result.style.color = "#7b2cbf";
      } else if (score >= 4) {
        photo.src = "naelya_sad.jpg";
        result.textContent = "Неплохо! Но можно попробовать ещё раз 😊";
        result.style.color = "#b65f19";
      } else {
        photo.src = "naelya_angry.jpg";
        result.textContent = "Ну всё, Наэля сердится! Попробуй ещё раз! 😈";
        result.style.color = "red";
      }
    }

    nextButton.addEventListener("click", () => {
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        showFinal();
      }
    });

    restartButton.addEventListener("click", () => {
      current = 0;
      score = 0;
      answered = false;
      nextButton.classList.remove("hidden");
      restartButton.classList.add("hidden");
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
